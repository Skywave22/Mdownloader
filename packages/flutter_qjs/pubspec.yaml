name: flutter_qjs
description: >
  kodjodevf/flutter_qjs@f3cef51, the QuickJS binding the AnymeX runtime bridge runs
  Mangayomi, Sora and LnReader JavaScript on - built for Android and Windows only.
  See README.md for why.
# Upstream is 0.0.1; the +1 marks this as the patched copy.
version: 0.0.1+1
publish_to: 'none'
homepage: https://github.com/kodjodevf/flutter_qjs

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.2

# Upstream also declares linux, macos and ios. They are left out on purpose: the
# QuickJS FFI layer here exports the same ~50 C symbols as flutter_js_ng's, and
# both are looked up with DynamicLibrary.process() on those platforms, so one
# engine ends up calling the other's functions. See README.md.
flutter:
  plugin:
    platforms:
      android:
        pluginClass: FlutterQjsPlugin
        package: soko.ekibun.flutter_qjs
      windows:
        pluginClass: FlutterQjsPlugin
  assets:
    - assets/js/
