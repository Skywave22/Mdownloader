name: d4rt
description: >
  d4rt 0.1.7, the Dart interpreter the AnymeX runtime bridge runs Mangayomi's
  Dart extensions on, ported to analyzer ^14.4.0. See README.md for why.
# Upstream is 0.1.7; the +1 marks this as the patched copy.
version: 0.1.7+1
publish_to: 'none'
homepage: https://github.com/kodjodevf/d4rt

environment:
  sdk: ^3.5.0

dependencies:
  # Upstream: ^7.4.5. The app resolves analyzer 14: source_gen 4.3, which every
  # code generator in this repo is built on, requires >=14.0.0 <15.0.0. This
  # is the one constraint that had to move; the parser and AST calls d4rt
  # makes are the only analyzer API it touches (see README.md).
  analyzer: ^14.4.0
  pub_semver: ^2.2.0

dev_dependencies:
  lints: ^5.1.1
  test: ^1.25.15
