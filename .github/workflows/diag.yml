# TEMPORARY - exists only on the fix branch while the CI dependency failure is
# being diagnosed, and is deleted before the fix is finished. It runs a real
# Flutter 3.47.5 so the answers come from the actual pub solver and compiler.
name: Diag (temporary)

on:
  push:
    branches: [arena/01a0fab5-mdownloader]
    paths: ['diag/**', '.github/workflows/diag.yml']

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Versions
        run: |
          flutter --version
          dart --version

      - name: d4rt port - analyze and run the upstream test suite
        continue-on-error: true
        run: python3 diag/d4rt.py

      - name: Resolve - find the overrides that make pub get succeed
        id: resolve
        continue-on-error: true
        run: python3 diag/run.py resolve

      - name: Native plugin surface vs the ledger test
        if: steps.resolve.outcome == 'success'
        continue-on-error: true
        run: python3 diag/run.py plugins

      - name: Codegen (gen-l10n + build_runner)
        if: steps.resolve.outcome == 'success'
        continue-on-error: true
        run: python3 diag/run.py gen

      - name: Analyze
        if: steps.resolve.outcome == 'success'
        continue-on-error: true
        run: python3 diag/run.py analyze

      - name: Compile probe (bridge + its transitive deps)
        if: steps.resolve.outcome == 'success'
        continue-on-error: true
        run: python3 diag/run.py probe

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diag/results
          git commit -m "diag: results [skip ci]" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"
