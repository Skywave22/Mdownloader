# TEMPORARY diagnostics: captures flutter analyze output and commits it to
# the branch so it can be read despite blocked CI logs. Delete after use.
name: diag

on:
  push:
    branches:
      - arena/01a0fb7d-mdownloader

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: |
          mkdir -p diag
          flutter analyze > diag/flutter_analyze.txt 2>&1 || true
          dart analyze --fatal-infos > diag/dart_analyze.txt 2>&1 || true
          cat diag/flutter_analyze.txt | tail -40
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add diag
          git commit -m "diag: analyzer output" || true
          git pull --rebase origin "$GITHUB_REF_NAME" || true
          git push origin "HEAD:$GITHUB_REF_NAME" || true
