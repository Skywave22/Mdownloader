name: Diag
on:
  pull_request:
    branches: [main]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Analyze (annotations)
        run: |
          set +e
          flutter analyze > analyze.txt 2>&1
          code=$?
          grep -E "error •|warning •" analyze.txt | while IFS= read -r line; do
            echo "::error::ANALYZE $line"
          done
          tail -n 40 analyze.txt
          exit 0
      - name: Test (annotations)
        run: |
          set +e
          flutter test > test.txt 2>&1
          grep -E "^00:|^01:|Some tests failed|Error:|Exception|failed" test.txt | head -40 | while IFS= read -r line; do
            echo "::error::TEST $line"
          done
          tail -n 60 test.txt
          exit 0
