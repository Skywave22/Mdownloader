# TEMPORARY - exists only on the fix branch while the CI failures are being
# worked through, and is deleted before the fix is finished. It runs the same
# steps as ci.yml (the Analyze & Test steps are read out of ci.yml itself) on
# plain ubuntu, so Android and Linux problems can be iterated on without
# starting the Windows, macOS and iOS legs, which bill at 10x.
name: Diag (temporary)

on:
  push:
    branches: [arena/01a0fab5-mdownloader]
    paths: ['diag/**', '.github/workflows/diag.yml']

permissions:
  contents: write

concurrency:
  group: diag
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  analyze-and-test:
    name: Analyze & Test (ci.yml steps)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: pip install pyyaml
      - name: Run the analyze-and-test steps from ci.yml
        run: python3 diag/ci_steps.py analyze-and-test
      - name: Native plugin ledger vs the manifest
        continue-on-error: true
        run: python3 diag/run.py plugins
      - name: Commit results and regenerated files
        if: always()
        run: |
          bash diag/commit_results.sh "diag: analyze-and-test" \
            diag/results pubspec.lock lib/l10n/generated \
            linux/flutter windows/flutter macos/Flutter

  package-d4rt:
    name: Package d4rt (port + upstream suite)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: python3 diag/d4rt.py
      - name: Commit results
        if: always()
        run: |
          bash diag/commit_results.sh "diag: d4rt" diag/results

  build-android:
    name: Build Android (debug apk)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - run: flutter config --enable-linux-desktop --enable-macos-desktop --enable-windows-desktop
      - name: Install Flutter Dependencies
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
      - name: Trim TorrServer Binaries
        run: rm -f packages/flutter_torrent_server/assets/torrserver/TorrServer-*
      - name: Build
        run: python3 diag/build_log.py android "flutter build apk --debug"
      - name: Commit results
        if: always()
        run: |
          bash diag/commit_results.sh "diag: android build" diag/results

  build-linux:
    name: Build Linux (debug) + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=5 -o Acquire::http::Timeout=30
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libvlc-dev libasound2-dev libsecret-1-dev \
            xvfb
      - run: flutter config --enable-linux-desktop --enable-macos-desktop --enable-windows-desktop
      - name: Install Flutter Dependencies
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
      - name: Trim TorrServer Binaries
        run: |
          cd packages/flutter_torrent_server/assets/torrserver
          find . -type f ! -name "TorrServer-linux-amd64" -delete
      - name: Build
        run: python3 diag/build_log.py linux "flutter build linux --debug"
      - name: Smoke test
        run: python3 diag/build_log.py linux_smoke "xvfb-run -a flutter test --no-pub integration_test -d linux"
      - name: Commit results
        if: always()
        run: |
          bash diag/commit_results.sh "diag: linux build" diag/results
