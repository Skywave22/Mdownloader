name: Diag (temporary)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  pull-requests: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Capture
        run: |
          set +e
          flutter test > test.txt 2>&1
          {
            echo "## Diag: failing tests"
            echo '```'
            grep -E "\[E\]" test.txt | head -80
            echo '```'
            echo "## Summary"
            echo '```'
            grep -E "^[0-9]{2}:[0-9]{2} \+.*:" test.txt | tail -2
            grep -E "error •" <(flutter analyze 2>&1) | head -15
            echo '```'
          } > diag_note.md
          grep -E "\[E\]" test.txt | head -10 | while IFS= read -r line; do
            echo "::error::FAIL $line"
          done
          cat diag_note.md
      - name: Comment results
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file diag_note.md || true
