name: Diag (temporary)
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Capture
        run: |
          set +e
          flutter test > test.txt 2>&1
          {
            echo "=== failing tests ==="
            grep -E "\[E\]" test.txt | head -60
            echo "=== summary ==="
            grep -E "^[0-9]{2}:[0-9]{2} \+.*:" test.txt | tail -2
            echo "=== analyze errors ==="
            flutter analyze 2>&1 | grep -E "error •" | head -20
          } > diag_output.txt
          cat diag_output.txt
      - name: Commit results
        run: |
          git config user.name diag-bot
          git config user.email diag@users.noreply.github.com
          git add diag_output.txt
          git commit -m "chore(diag): capture test results [skip ci]" || true
          git push origin "HEAD:refs/heads/${{ github.head_ref }}" || true
