# Generates lib/l10n/generated from the ARB files and publishes it as an
# artifact.
#
# Why this exists: lib/l10n/generated/** is COMMITTED (see the "Check
# gen-l10n Output Is Committed" step in ci.yml - the app reads the generated
# Dart, not the .arb files, so a stale commit ships nothing), and the output
# is `dart format`-style formatted by the generator itself, so hand-editing it
# is not a thing anyone should be doing. This workflow is the deterministic
# way to produce it: same Flutter version ci.yml gates on, so what lands here
# is byte-identical to what the CI drift check regenerates.
#
# Usage: Actions -> l10n codegen -> Run workflow (on your branch), then
#   gh run download <run-id> -n l10n-generated -D /tmp/l10n
#   cp -R /tmp/l10n/lib/l10n/generated/* lib/l10n/generated/
# and commit the result alongside your ARB changes.

name: l10n codegen

on:
  workflow_dispatch:
  # TEMPORARY (remove before merge): registers the workflow on a feature
  # branch, where workflow_dispatch is not available until the file lands on
  # the default branch. One run to produce the artifact, then this goes back
  # to workflow_dispatch-only.
  push:
    branches: [arena/01a0fb7d-mdownloader]

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  gen:
    name: Generate l10n
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Dependencies
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Upload Generated Localizations
        uses: actions/upload-artifact@v7
        with:
          name: l10n-generated
          path: lib/l10n/generated
          retention-days: 7
          if-no-files-found: error
