name: mdownloader
description: >-
  MDownloader — TMDB catalog (movies + series) with multi-source scraping and a
  real parallel segmented download manager. Builds to Android APK and Windows EXE.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  path_provider: ^2.1.3
  video_player: ^2.8.6
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
